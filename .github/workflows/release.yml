name: Release macOS App

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Select and verify Xcode 16+
        id: xcode_setup
        run: |
          set -euo pipefail

          candidates=()
          for app in /Applications/Xcode*.app; do
            if [ ! -d "$app" ]; then
              continue
            fi

            version=$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)
            [ -n "$version" ] || continue

            major="${version%%.*}"
            if [ "$major" -lt 16 ]; then
              continue
            fi

            candidates+=("$version|$app")
          done

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "No Xcode installation with major version 16+ found."
            echo "Installed Xcode apps:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "None"
            exit 1
          fi

          best=$(printf '%s\n' "${candidates[@]}" | sort -t'|' -k1,1V | tail -n 1)
          selected_version="${best%%|*}"
          selected_app="${best#*|}"

          echo "Using Xcode ${selected_version} at ${selected_app}"
          echo "DEVELOPER_DIR=${selected_app}/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected_xcode_version=$selected_version" >> "$GITHUB_OUTPUT"
          echo "selected_xcode_app=$selected_app" >> "$GITHUB_OUTPUT"

      - name: Verify Xcode compatibility
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          major="${xcode_version%%.*}"
          if [ "$major" -lt 16 ]; then
            echo "xcodebuild reported version ${xcode_version}, but format 77 requires Xcode 16+."
            exit 1
          fi
          echo "Using Xcode ${xcode_version}"

      - name: Build release artifacts
        id: build
        run: |
          set -euo pipefail

          IS_TAG="false"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IS_TAG="true"
          fi

          if [ "$IS_TAG" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ -z "$VERSION" ]; then
              echo "Could not derive version from tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="Release ${GITHUB_REF_NAME}"
            PRERELEASE="false"
            MAKE_LATEST="true"
          else
            VERSION="${GITHUB_SHA::7}"
            RELEASE_TAG="nightly-${GITHUB_RUN_NUMBER}-${VERSION}"
            RELEASE_NAME="Nightly ${VERSION} (${GITHUB_RUN_NUMBER})"
            PRERELEASE="true"
            MAKE_LATEST="false"
          fi

          chmod +x ./build.sh
          ./build.sh "$VERSION" --local

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag }}
          name: ${{ steps.build.outputs.release_name }}
          prerelease: ${{ steps.build.outputs.prerelease }}
          make_latest: ${{ steps.build.outputs.make_latest }}
          target_commitish: ${{ steps.build.outputs.release_sha }}
          files: |
            dist/${{ steps.build.outputs.version }}/MacAssistant-${{ steps.build.outputs.version }}.dmg
            dist/${{ steps.build.outputs.version }}/MacAssistant-${{ steps.build.outputs.version }}.zip
            dist/${{ steps.build.outputs.version }}/SHA256SUMS.txt
